[tool.poetry]
name = "appmapper"
version = "0.1.0"
description = "Attack Surface Discovery & Pentest Automation Framework (Tier 1 MVP) - discovery/recon/analysis only, no exploitation."
authors = ["Security Training <security@example.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "core" },
    { include = "config" },
    { include = "models" },
    { include = "storage" },
    { include = "modules" },
    { include = "parsers" },
    { include = "reporting" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
httpx = ">=0.27"
dnspython = ">=2.6"
cryptography = ">=42.0"
pydantic = ">=2.7"
pydantic-settings = ">=2.3"
pyyaml = ">=6.0"
sqlalchemy = ">=2.0"
structlog = ">=24.1"
typer = ">=0.12"
rich = ">=13.7"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=0.23"
respx = ">=0.21"
ruff = ">=0.5"
black = ">=24.4"

# Optional: enables `auth capture` (manual browser session capture).
# Install with:  pip install playwright && playwright install chromium
[tool.poetry.group.browser]
optional = true

[tool.poetry.group.browser.dependencies]
playwright = ">=1.44"

[tool.poetry.scripts]
asdf = "main:app"
appmapper = "main:app"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
